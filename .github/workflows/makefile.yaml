name: Build dylib

on:
  workflow_dispatch:
  push:
    paths:
      - "*.m"
      - "*.h"
      - "Makefile"
      - ".github/workflows/makefile.yml"
  pull_request:
    paths:
      - "*.m"
      - "*.h"
      - "Makefile"
      - ".github/workflows/makefile.yml"

permissions:
  contents: read

concurrency:
  group: immortalizer-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ZImmortalizerJailed.dylib
    runs-on: macos-14

    env:
      THEOS: ${{ github.workspace }}/theos
      # Pinned so a future Theos or SDK update cannot silently change a build.
      # Update this deliberately after validating the project against the new revision.
      THEOS_COMMIT: 16362d3aa83a0acd56df4493d575d34306d42478

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache pinned Theos toolchain
        id: theos-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ github.workspace }}/theos
          key: theos-${{ runner.os }}-${{ env.THEOS_COMMIT }}

      - name: Install pinned Theos and SDK submodules
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf "$THEOS"
          git init "$THEOS"
          git -C "$THEOS" remote add origin https://github.com/theos/theos.git
          git -C "$THEOS" fetch --depth 1 origin "$THEOS_COMMIT"
          git -C "$THEOS" checkout --detach FETCH_HEAD
          git -C "$THEOS" submodule update --init --recursive --depth 1

      - name: Install ldid
        run: brew list ldid >/dev/null 2>&1 || brew install ldid

      - name: Show pinned toolchain info
        run: |
          set -euo pipefail
          echo "THEOS=$THEOS"
          echo "Theos commit: $(git -C "$THEOS" rev-parse HEAD)"
          test "$(git -C "$THEOS" rev-parse HEAD)" = "$THEOS_COMMIT"
          ls "$THEOS/sdks"

      - name: Build
        run: |
          set -euo pipefail
          make clean
          make

      - name: Locate built dylib
        id: locate
        run: |
          set -euo pipefail
          DYLIB="$(find .theos/obj -name 'ZImmortalizerJailed.dylib' -print -quit)"
          if [ -z "$DYLIB" ]; then
            echo "::error::Build finished but ZImmortalizerJailed.dylib was not found under .theos/obj"
            find .theos -maxdepth 3 -type f | sort
            exit 1
          fi
          echo "Found dylib at $DYLIB"
          echo "dylib_path=$DYLIB" >> "$GITHUB_OUTPUT"

      - name: Upload dylib artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ZImmortalizerJailed-dylib
          path: ${{ steps.locate.outputs.dylib_path }}
          if-no-files-found: error
